find_trending_companies:
  description: >
    Find exactly 3 publicly traded companies trending in {sector} as of {current_date} by searching current news.
    Return each company once, include its ticker and cite the source URLs that support why it is trending.
    Use at most 2 focused search calls; combine companies in a query when practical.
    {language_instruction}
  expected_output: >
    A list of trending companies in {sector}
  agent: trending_company_finder
  output_file: output/trending_companies.json

research_trending_companies:
  description: >
    Given the 3 trending companies, provide a concise analysis of each by searching current, credible sources.
    Cover market position, material risks, catalysts, and investment potential as of {current_date}; cite source URLs and never repeat a company.
    Use at most 3 focused search calls, normally one per company, and rely on the 4 results returned by each search.
    {language_instruction}
  expected_output: >
    A report containing detailed analysis of each company
  agent: financial_researcher
  context:
    - find_trending_companies
  output_file: output/research_report.json

pick_best_company:
  description: >
    Analyze the research findings and pick exactly one company as the strongest candidate. Ensure research is up to date as of {current_date}.
    Then respond with a detailed report on why you chose this company, and which companies were not selected.
    {language_instruction}
  expected_output: >
    The chosen company and why it was chosen; the companies that were not selected and why they were not selected.
  agent: stock_picker
  context:
    - research_trending_companies
  output_file: output/decision.md
